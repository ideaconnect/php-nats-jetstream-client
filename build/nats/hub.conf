# JetStream hub with a domain (#273): its JetStream answers on $JS.hub.API.> for the leaf node of
# leaf.conf, which runs without JetStream. The tests reach the hub through the leaf node with
# NatsClient::jetStream(domain: 'hub'), and the hub directly on its own client port.
port: 4222
http_port: 8222
server_name: hub

jetstream {
  domain: hub
}

leafnodes {
  port: 7422
}
