# Leaf node without JetStream, connected to the hub of hub.conf (#273). A client connected here gets
# no responders on $JS.API.> and reaches the hub's JetStream under its domain, $JS.hub.API.>.
port: 4222
http_port: 8222
server_name: leaf

leafnodes {
  remotes: [
    { url: "nats-leaf://nats-hub:7422" }
  ]
}
