port: 4222
http_port: 8222
jetstream: true

authorization {
  users = [
    { user: "local-user", password: "local-pass" }
    # May not publish to "permissions.refused.>" nor ask for consumer info: the server refuses such requests
    # with a permissions violation (features/auth/userpass_auth.feature).
    { user: "limited-user", password: "limited-pass", permissions: { publish: { deny: ["permissions.refused.>", "$JS.API.CONSUMER.INFO.>"] } } }
  ]
}