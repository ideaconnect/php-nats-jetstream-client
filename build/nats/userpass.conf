port: 4222
http_port: 8222
jetstream: true

authorization {
  users = [
    { user: "local-user", password: "local-pass" }
    # May not publish to "permissions.refused.>", ask for consumer info nor pull: the server refuses such requests and
    # pulls with a permissions violation (features/auth/userpass_auth.feature).
    { user: "limited-user", password: "limited-pass", permissions: { publish: { deny: ["permissions.refused.>", "$JS.API.CONSUMER.INFO.>", "$JS.API.CONSUMER.MSG.NEXT.>"] } } }
  ]
}