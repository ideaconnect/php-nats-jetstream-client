# NATS fixtures for the integration tests, Behat and the examples (scripts/run-tests-e2e.sh).
#
# The servers run without debug or trace logging (-D, -V). Trace logging writes every inbound payload in
# full (max_traced_msg_len defaults to 0) through Docker's log pipeline while the timing-sensitive suites
# run, and nothing reads it: no test reads server logs, and CI prints them only when a server fails to
# start (scripts/wait-for-nats-services.sh), whose errors are logged without -D or -V. To trace a server
# while debugging, add "-DV" to its command and recreate it: `docker compose up -d --force-recreate <name>`.
#
# Readiness is checked by scripts/wait-for-nats-services.sh, not by these healthchecks: nothing in the
# repository reads the health status (no depends_on condition, no `docker compose up --wait`). They
# therefore probe every 30 s instead of every 2 s, which was 4 container execs a second across the 8
# servers, and still mark a server unhealthy after the same 2 minutes of failed probes.
services:
  nats:
    image: nats:2.12-alpine
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/varz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 2s
      retries: 4
      start_period: 5s
    ports:
      - "14222:4222"
      - "18222:8222"

  nats-token:
    image: nats:2.12-alpine
    command: ["--config", "/etc/nats-config/token.conf"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/varz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 2s
      retries: 4
      start_period: 5s
    volumes:
      - ${NATS_PROJECT_ROOT:-.}/build/nats:/etc/nats-config:ro
    ports:
      - "14223:4222"
      - "18223:8222"

  nats-userpass:
