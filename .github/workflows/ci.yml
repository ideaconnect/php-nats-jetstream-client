name: CI

on:
  push:
  pull_request:

jobs:
  fast-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets
      - uses: ramsey/composer-install@v3
      - run: composer stan
      - run: composer test:unit

  integration:
    runs-on: ubuntu-latest
    needs: fast-quality
    strategy:
      matrix:
        php: ["8.2", "8.5"]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets
      - uses: ramsey/composer-install@v3
      - name: Start NATS Docker Compose
        run: docker compose up -d
      - name: Run integration tests
        env:
          RUN_INTEGRATION: "1"
          NATS_URL: nats://127.0.0.1:14222
        run: composer test:integration
      - name: Stop NATS Docker Compose
        if: always()
        run: docker compose down
